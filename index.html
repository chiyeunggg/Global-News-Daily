  .news-summary { font-size: 13px; color: #555; line-height: 1.6; margin-bottom: 6px; }

<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var SEC = {
    global: {icon:'🌐', title:'全球頭條新聞', nav:'全球頭條', flag:'flag-global', cls:''},
    hk:     {icon:'🇭🇰', title:'香港頭條新聞', nav:'香港新聞', flag:'flag-hk', cls:'hk-card'},
    us:     {icon:'🇺🇸', title:'美國頭條新聞', nav:'美國新聞', flag:'flag-us', cls:'us-card'},
    crypto: {icon:'₿', title:'加密貨幣新聞', nav:'加密貨幣', flag:'flag-crypto', cls:'crypto-card'},
    other:  {icon:'📰', title:'其他重要新聞', nav:'其他新聞', flag:'flag-other', cls:''}
  };
  var CAT_ICON = [['人道','❤️'],['天災','🌀'],['地緣','🌍'],['能源','⛽'],['金融','📈'],['市場','📊'],['經濟','📈'],['監管','📜'],['司法','⚖️'],['政策','🏛️'],['政治','🏛️'],['科技','🔬'],['安全','🔐'],['行業','🏢'],['外交','🤝']];
  function catIcon(c){for(var i=0;i<CAT_ICON.length;i++){if(c.indexOf(CAT_ICON[i][0])>-1)return CAT_ICON[i][1];}return '💡';}
  function geoIcon(g){
    if(g.indexOf('香港')===0)return '🇭🇰';
    if(g.indexOf('美國')===0||g.indexOf('全國')===0)return '🇺🇸';
    if(g.indexOf('全球')===0)return '🌍';
    return '📍';
  }
  var CAT_COLOR = {'科技':'#6c5ce7','商業':'#6c5ce7','能源':'#e17055','環境':'#00b894','外交':'#0984e3','體育':'#d63031','社會':'#6c5ce7'};
  function src(list){return '<div class="news-src">來源：'+list.map(function(p){return '<a href="'+esc(p[1])+'" target="_blank" rel="noopener">'+esc(p[0])+'</a>'}).join('')+'</div>';}

  /* header */
  /* 第一行：訪客當地今日日期 */
  var now = new Date(), WD = ['日','一','二','三','四','五','六'];
  document.getElementById('hdr-date').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日（星期'+WD[now.getDay()]+'）';
  document.getElementById('hdr-update').textContent = '最後更新：' + D.updated;

  /* nav: same order as original site */
  var order = ['global','hk','us','crypto','other'];
  document.getElementById('nav').innerHTML = order.map(function(id,i){
    return '<a href="#'+id+'"'+(i===0?' class="active"':'')+'>'+SEC[id].icon+' '+SEC[id].nav+'</a>';
  }).join('');

  /* quotes (置頂報價) + sidebar market */
  function chgCls(dir){return dir==='up'?'q-up':dir==='down'?'q-down':'q-flat';}
  document.getElementById('quotes').innerHTML = D.tape.map(function(t){
    return '<span class="quote"><span class="q-name">'+esc(t.k)+'</span><span class="q-val">'+esc(t.v)+'</span><span class="q-chg '+chgCls(t.dir)+'">'+esc(t.d)+'</span></span>';
  }).join('');
  document.getElementById('quote-note').textContent = D.tapeNote;
  var mColor = {up:'#00b894',down:'#d63031',flat:'#856404'};
  document.getElementById('market').innerHTML = D.tape.map(function(t){
    return '<div class="market-row"><span class="market-name">'+esc(t.k)+'</span><span class="market-val">'+esc(t.v)+' <span style="font-size:11px;color:'+mColor[t.dir]+';">'+esc(t.d)+'</span></span></div>';
  }).join('');

  var byId = {}; D.sections.forEach(function(s){byId[s.id]=s;}); byId.crypto = D.crypto;

  /* ticker: all headlines */
  var tick = [];
  ['global','hk','us','crypto'].forEach(function(id){ byId[id].stories.forEach(function(st){ tick.push(SEC[id].icon+' '+esc(st.h)); }); });
  var tickHtml = tick.join(' &nbsp;&nbsp;|&nbsp;&nbsp; ') + ' &nbsp;&nbsp;|&nbsp;&nbsp; ';
  document.getElementById('ticker-content').innerHTML = tickHtml + tickHtml; /* 兩份內容，無縫循環 */
  /* 按內容長度設定速度：每秒約 50px，方便閱讀 */
  var tc = document.getElementById('ticker-content');
  function setTickerSpeed(){ var w = tc.scrollWidth; if(w) tc.style.animationDuration = Math.round((w/2)/50) + 's'; }
  setTickerSpeed();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(setTickerSpeed);

  /* sidebar brief: #1 of each section */
  document.getElementById('brief').innerHTML = ['global','hk','us','crypto'].map(function(id){
    return '<div class="market-row brief-row"><span class="market-name">'+SEC[id].icon+' '+SEC[id].nav+'</span><span class="market-val">'+esc(byId[id].stories[0].h)+'</span></div>';
  }).join('');

  /* sections */
  function storySection(id){
    var s = byId[id], m = SEC[id];
    return '<div id="'+id+'" class="news-section '+m.cls+'"><div class="section-header"><div class="section-flag '+m.flag+'"></div><div class="section-title">'+m.icon+' '+m.title+'</div></div>'+
      s.stories.map(function(st,i){
        var top = i===0, pic = top && st.img;
        return '<div class="news-card'+(top?' top-story':'')+(top&&!pic?' no-img':'')+'">'+(pic?'<figure class="top-photo"><img src="'+esc(st.img.src)+'" alt="'+esc(st.img.cap)+'" loading="lazy"'+(st.img.pos?' data-pos="'+esc(st.img.pos)+'" style="object-position:'+esc(st.img.pos)+'"':'')+'><figcaption>'+esc(st.img.cap)+'（'+'<a href="'+esc(st.img.link)+'" target="_blank" rel="noopener">'+esc(st.img.credit)+'</a>，'+esc(st.img.license)+'）</figcaption></figure>':'')+(top?'<div class="top-text">':'')+'<div class="news-title-row"><span class="news-title">'+esc(st.h)+'</span></div>'+
          '<div class="news-summary">'+esc(st.s)+'</div>'+
          '<div class="news-meta"><span class="tag tag-importance">'+catIcon(st.cat)+' '+esc(st.cat)+'</span><span class="tag tag-geo">'+geoIcon(st.geo)+' '+esc(st.geo)+'</span><span class="tag-reason">'+esc(st.why)+'</span></div>'+
          src(st.src)+(top?'</div>':'')+'</div>';
      }).join('')+'</div>';
  }
  var o = D.other;
  var otherHtml = '<div id="other" class="news-section"><div class="section-header"><div class="section-flag flag-other"></div><div class="section-title">📰 其他重要新聞</div></div><div class="other-grid">'+
    o.groups.map(function(g){
      var col = CAT_COLOR[g.label] || '#6c5ce7';
      return '<div class="other-news-cat"><div class="cat-label" style="background:'+col+';">'+esc(g.label)+'</div>'+
        g.items.map(function(it){
          return '<div class="other-item"><b style="font-size:15px; display:block; margin-bottom:2px;">'+esc(it.h)+'</b>'+esc(it.s)+'<div class="news-meta"><span class="tag tag-geo">'+geoIcon(it.geo)+' '+esc(it.geo)+'</span></div>'+
            '<div class="news-src">來源：<a href="'+esc(it.src[1])+'" target="_blank" rel="noopener">'+esc(it.src[0])+'</a></div></div>';
        }).join('')+'</div>';
    }).join('')+'</div></div>';

  document.getElementById('main').innerHTML = storySection('global')+storySection('hk')+storySection('us')+storySection('crypto')+otherHtml;
  /* 相片裁切：直身相（多為人像）預設對準上方，避免切走個頭；JSON 可用 img.pos 指定焦點 */
  Array.prototype.forEach.call(document.querySelectorAll('.top-photo img'), function(img){
    if(img.getAttribute('data-pos')) return;
    function fit(){ if(img.naturalHeight > img.naturalWidth * 0.9) img.style.objectPosition = 'center 12%'; }
    if(img.complete && img.naturalWidth) fit(); else img.addEventListener('load', fit);
  });

  /* footer sources */
  var names = {};
  order.forEach(function(id){
    if(id==='other'){o.groups.forEach(function(g){g.items.forEach(function(it){names[it.src[0].replace(/（.*）/,'')]=1;});});}
    else byId[id].stories.forEach(function(st){st.src.forEach(function(p){names[p[0].replace(/（.*）/,'')]=1;});});
  });
  document.getElementById('foot-src').textContent = '資料來源：' + Object.keys(names).join('、');
})();
</script>
<script>
/* 訪客統計（GoatCounter）：填入 GoatCounter 代號後啟用 */
(function(){
  var GC_CODE = '';
  if(!GC_CODE) return;
  var base = 'https://' + GC_CODE + '.goatcounter.com';
  var t = document.createElement('script');
  t.async = true; t.src = 'https://gc.zgo.at/count.js';
  t.setAttribute('data-goatcounter', base + '/count');
  document.body.appendChild(t);
  var card = document.getElementById('visits-card');
  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function get(q){ return fetch(base + '/counter/TOTAL.json' + q).then(function(r){ if(!r.ok) throw r.status; return r.json(); }); }
  var d = new Date(), today = d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  get('').then(function(j){
    document.getElementById('visits-total').textContent = String(j.count).indexOf(',')>-1 ? j.count : fmt(j.count);
    card.hidden = false;
    return get('?start=' + today);
  }).then(function(j){
    document.getElementById('visits-today').textContent = String(j.count).indexOf(',')>-1 ? j.count : fmt(j.count);
  }).catch(function(){});
  document.getElementById('visits-note').textContent = '由 2026年9月27日 起計；同一訪客同日重複瀏覽只計一次。';
})();
</script>
